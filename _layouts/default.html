<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ site.title }}</title>
    
    <!-- Ask Google for Roboto font  -->
    <link rel="preconnect" href="https://googleapis.com"> 
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    
    <!-- JavaScript to manage Dark/Light state -->
    <script>
      // Update the website's background colors and change the lightbulbs
      function applyTheme(theme) {
        document.documentElement.setAttribute('data-theme', theme);
        localStorage.setItem('theme', theme);
        
        const solidBulb = document.getElementById('solid-bulb');
        const regularBulb = document.getElementById('regular-bulb');
        const btn = document.getElementById('theme-toggle-btn');
        
        if (solidBulb && regularBulb) {
          if (theme === 'light') {
            // Light Mode: Show the regular outline bulb
            regularBulb.style.display = 'inline-block';
            solidBulb.style.display = 'none';
            if (btn) {
              btn.setAttribute('aria-label', 'Switch to dark mode');
              btn.style.background = '#222'; // Dark button background
              regularBulb.setAttribute('stroke', '#fff'); // White stroke outline
            }
          } else {
            // Dark Mode: Show the solid glowing bulb
            solidBulb.style.display = 'inline-block';
            regularBulb.style.display = 'none';
            if (btn) {
              btn.setAttribute('aria-label', 'Switch to light mode');
              btn.style.background = '#111'; // Keeps button background dark so yellow pops!
              
              solidBulb.setAttribute('fill', '#FFD700');   // Fills the bulb with yellow
              solidBulb.setAttribute('stroke', '#FFD700'); // Changes the bulb outline to yellow
            }
          }
        }
      }

      // Default to dark mode if no preference is saved yet
      const savedTheme = localStorage.getItem('theme') || 'dark';
      document.documentElement.setAttribute('data-theme', savedTheme);

      window.addEventListener('DOMContentLoaded', () => {
        applyTheme(savedTheme);
      });

      // Update data-theme attribute
      function toggleTheme() {
        const currentTheme = document.documentElement.getAttribute('data-theme');
        const newTheme = currentTheme === 'light' ? 'dark' : 'light';
        applyTheme(newTheme);
      }
    </script>
  </head>
  <body>
    <div class="wrapper">
      <header>
        <h1><a href="{{ '/' | relative_url }}">{{ site.title }}</a></h1>
        <p>{{ site.description }}</p>
        
        <!-- Fully Accessible Lightbulb Toggle Button -->
        <button id="theme-toggle-btn" 
                onclick="toggleTheme()" 
                aria-label="Switch to dark mode" 
                style="padding: 8px 12px; margin-top: 15px; cursor: pointer; border-radius: 4px; border: 1px solid #444; background: #222; display: inline-flex; align-items: center; justify-content: center;">

          <!-- Solid Glowing Lightbulb (Visible when Dark, to turn layout Light) -->
          <svg id="solid-bulb" aria-hidden="true" focusable="false" xmlns="http://w3.org" width="20" height="20" viewBox="0 0 24 24" fill="#fff" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
            <path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .6 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/>
            <path d="M9 18h6"/>
            <path d="M10 22h4"/>
          </svg>

          <!-- Regular Outline Lightbulb (Visible when Light, to turn layout Dark) -->
          <svg id="regular-bulb" aria-hidden="true" focusable="false" xmlns="http://w3.org" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .6 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/>
            <path d="M9 18h6"/><path d="M10 22h4"/>
          </svg>
        
        </button>

      </header>
      <section>
        {{ content }}
      </section>
    </div>
    <script src="{{ '/assets/js/scale.fix.js' | relative_url }}"></script>
  </body>
</html>
