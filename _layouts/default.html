<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ site.title }}</title>
    
    <!-- Ask Google for Roboto font  -->
    <link rel="preconnect" href="https://googleapis.com"> 
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">

    <!-- Link Stylesheets & Icons -->
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="shortcut icon" type="image/png" href="{{ site.baseurl }}/assets/images/favicon.png">
    
    <!-- JavaScript to manage Dark/Light state -->
    <script>
    // Update website colors, lightbulbs, and the home button icon
      function applyTheme(theme) {
        document.documentElement.setAttribute('data-theme', theme);
        localStorage.setItem('theme', theme);
        
        const regularBulb = document.getElementById('regular-bulb');
        const btn = document.getElementById('theme-toggle-btn');
        
        const homeIcon = document.getElementById('regular-house');
        const homeBtn = document.getElementById('home-return-btn');

        // ENFORCE: Ensure home button starts hidden on page load / theme switch 
        // unless the folder is actively open. (We only want it hidden by default).
        if (homeBtn && document.getElementById('projects-content').style.display !== 'flex') {
          homeBtn.style.display = 'none';
        }
        
        if (regularBulb) {
          if (theme === 'light') {
            // ---- LIGHT MODE LAYOUT ----
            // Lightbulb settings light mode
            regularBulb.style.display = 'inline-block';
            regularBulb.setAttribute('stroke', '#000'); // Makes the bulb outline black!
            if (btn) {
              btn.setAttribute('aria-label', 'Switch to dark mode');
              btn.style.background = '#f0f0f0'; // Makes button background light grey
              btn.style.borderColor = '#ccc'; // Gives it a clean light border 
            }
            
            // All Home Button Light Mode styles grouped neatly here
            if (homeBtn) {
              homeBtn.style.background = '#f0f0f0'; // Makes button background light grey
              homeBtn.style.borderColor = '#ccc'; // Gives it a clean light border
              if (homeIcon) {
                homeIcon.style.display = 'inline-block';
                homeIcon.setAttribute('stroke', '#000'); // Makes the home outline black!
              }
            }
          } else {
            // ---- DARK MODE LAYOUT ----
            // Lightbulb settings dark mode
            regularBulb.style.display = 'inline-block';
            regularBulb.setAttribute('stroke', '#FFD700');  // Yellow glow wireframe
            if (btn) {
              btn.setAttribute('aria-label', 'Switch to light mode');
              btn.style.background = '#111';      // Makes button background charcoal dark
              btn.style.borderColor = '#444';     // Gives it a dark border
            }

            // All Home Button Dark Mode styles grouped neatly here
            if (homeBtn) {
              homeBtn.style.background = '#2B3338'; // It looks black if I put #111, so #2B3338 makes it look similar to the bulb button
              homeBtn.style.borderColor = '#444'; // Gives it a dark border
              if (homeIcon) {
                homeIcon.style.display = 'inline-block';
                homeIcon.setAttribute('stroke', '#fff'); // Makes the home outline white!
              }
            }
          }
        }
      }

      // Default to dark mode if no preference is saved yet
      const savedTheme = localStorage.getItem('theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);
      
        window.addEventListener('DOMContentLoaded', () => {
          applyTheme(savedTheme);
        });

      // Update data-theme attribute
      function toggleTheme() {
          const currentTheme = document.documentElement.getAttribute('data-theme');
          const newTheme = currentTheme === 'light' ? 'dark' : 'light';
          applyTheme(newTheme);
        }

        // Update folder icon button, toggle homepage view, and show/hide Home button
        function toggleFolder(contentId, buttonElement) {
          const content = document.getElementById(contentId);
          const introSection = document.getElementById('home-intro');
          const openedView = document.getElementById('folder-opened-view');
          const homeBtn = document.getElementById('home-return-btn');
          
          const closedIcon = buttonElement.querySelector('.folder-closed');
          const openIcon = buttonElement.querySelector('.folder-open');
      
          const isClosed = content.style.display === 'none' || content.style.display === '';
      
          if (isClosed) {
            // Open folder view
            content.style.display = 'flex';
            buttonElement.setAttribute('aria-expanded', 'true');
            
            if (introSection) introSection.style.display = 'none';
            if (openedView) openedView.style.display = 'block';
            if (homeBtn) homeBtn.style.display = 'inline-flex'; // SHOW HOME BUTTON
      
            // Clean icon swap for Font Awesome
            if (closedIcon && openIcon) {
              closedIcon.style.display = 'none';
              openIcon.style.display = 'inline-block';
            }
          } else {
            // Close folder view
            content.style.display = 'none';
            buttonElement.setAttribute('aria-expanded', 'false');
            
            if (introSection) introSection.style.display = 'block';
            if (openedView) openedView.style.display = 'none';
            if (homeBtn) homeBtn.style.display = 'none'; // HIDE HOME BUTTON
      
            // Clean icon swap back
            if (closedIcon && openIcon) {
              closedIcon.style.display = 'inline-block';
              openIcon.style.display = 'none';
            }
          }
        }
      
        // Reset function when clicking the Home button
        function resetToHome() {
          const folderBtn = document.querySelector('.folder-btn');
          const subFiles = document.getElementById('projects-content');
          
          // If folder is currently open, trigger the toggle to close it and reset view
          if (subFiles && subFiles.style.display === 'flex') {
            toggleFolder('projects-content', folderBtn);
          }
        }
    </script>
  </head>
  <body>
    <div class="wrapper">
      <header>
        <h1><a href="{{ '/' | relative_url }}">{{ site.title }}</a></h1>
        <p>{{ site.description }}</p>
        
        <!-- Container for buttons side-by-side -->
        <div style="display: flex; gap: 10px; align-items: center; margin-top: 15px;">
          
          <!-- Lightbulb Toggle Button -->
          <button id="theme-toggle-btn" 
                  onclick="toggleTheme()" 
                  aria-label="Switch to dark mode" 
                  style="padding: 12px 18px; cursor: pointer; border-radius: 6px; border: 1px solid #444; background: #222; display: inline-flex; align-items: center; justify-content: center;">
            <svg id="regular-bulb" aria-hidden="true" focusable="false" xmlns="http://w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
              <path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .6 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/>
              <path d="M9 18h6"/><path d="M10 22h4"/>
            </svg>
          </button>
      
          <!-- Contextual Home Button (Hidden by default, shown when folder opens) -->
          <button id="home-return-btn" 
                  onclick="resetToHome()" 
                  aria-label="Return to homepage" 
                  style="display: none; padding: 12px 18px; cursor: pointer; border-radius: 6px; border: 1px solid #444; background: #222; display: inline-flex; align-items: center; justify-content: center;">
            <svg id="regular-bulb" aria-hidden="true" focusable="false" xmlns="http://w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
              <path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .6 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/>
              <path d="M9 18h6"/><path d="M10 22h4"/>
            </svg>
            <!-- Regular Outline House SVG For Home Icon -->
            <svg id="regular-house" aria-hidden="true" focusable="false" xmlns="http://w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
              <path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/>
              <path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          </svg>
          </button>
      
        </div>
    </header>
      <section>
        {{ content }}
      </section>
    </div>
    <script src="{{ '/assets/js/scale.fix.js' | relative_url }}"></script>
  </body>
</html>
